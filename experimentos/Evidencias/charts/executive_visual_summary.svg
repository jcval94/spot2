<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="760" viewBox="0 0 1250 760"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.u{font-size:15px;fill:#5b6577}.k{font-size:13px;fill:#526071}.v{font-size:31px;font-weight:700}.d{font-size:13px}.h{font-size:17px;font-weight:700}.a{font-size:14px}</style><text class="t" x="60" y="42">Spot 2 · Executive visual evidence summary</text><text class="u" x="60" y="70">What the current empirical evidence supports — and where uncertainty remains</text><rect x="60" y="100" width="350" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="k" x="80" y="130">Best temporal OOF AP</text><text class="v" x="80" y="172">0.472</text><text class="d" x="80" y="205">Specialist CatBoost</text><rect x="445" y="100" width="350" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="k" x="465" y="130">Best service-match lift</text><text class="v" x="465" y="172">1.51×</text><text class="d" x="465" y="205">DN4 × LOC1 × BSV1 · n=60</text><rect x="830" y="100" width="350" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="k" x="850" y="130">N1 → DN1 transition</text><text class="v" x="850" y="172">99.8%</text><text class="d" x="850" y="205">T0 state is nearly deterministic</text><rect x="60" y="265" width="350" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="k" x="80" y="295">Actionable semantic spots</text><text class="v" x="80" y="337">230</text><text class="d" x="80" y="370">Offline semantic discovery</text><rect x="445" y="265" width="350" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="k" x="465" y="295">Rules v2 incremental</text><text class="v" x="465" y="337">+182</text><text class="d" x="465" y="370">Unique spots · +6.07% inventory</text><rect x="830" y="265" width="350" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="k" x="850" y="295">LLM final evaluation</text><text class="v" x="850" y="337">PENDING</text><text class="d" x="850" y="370">No LLM predictions executed yet</text><text class="h" x="60" y="465">Decision-level read</text><text class="a" x="60" y="497">• Modelo 3 has real ranking signal, but architecture leadership varies by metric/fold; no universal winner.</text><text class="a" x="60" y="525">• T1 Dynamic Need adds meaningful state resolution, especially for N2/N3, while N1 is already highly concentrated.</text><text class="a" x="60" y="553">• Matching cells can reach >1.5× lift, but support and Wilson bounds must remain part of the decision rule.</text><text class="a" x="60" y="581">• Inventory quality is a justified LLM use case, but the LLM experiment is not complete until predictions + human labels exist.</text><rect x="60" y="615" width="1135" height="70" rx="10" fill="#fff7ed" stroke="#fdba74"/><text class="h" x="80" y="645">Main caveat</text><text class="a" x="80" y="670">Offline predictive/associational evidence ≠ causal impact. Online A/B remains the cleanest next validation for routing/matching.</text></svg>