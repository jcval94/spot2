<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.u{font-size:14px;fill:#5b6577}.h{font-size:16px;font-weight:700}.a{font-size:13px}.bad{font-size:13px;font-weight:700;fill:#9f1239}</style><text class="t" x="60" y="38">Concrete semantic contradiction examples</text><text class="u" x="60" y="64">Examples come from deterministic candidate rules; they require review and are not LLM predictions.</text><rect x="60" y="100" width="530" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="h" x="82" y="134">Spot 1 · natural_light</text><text class="bad" x="82" y="162">HIGH candidate contradiction</text><text class="a" x="82" y="196">Copy:</text><text class="a" x="82" y="218">Amplio espacio con buena iluminación natural.</text><text class="a" x="82" y="254">Structured:</text><text class="a" x="82" y="276">natural_light = False</text><text class="a" x="82" y="310">Why:</text><text class="a" x="82" y="332">Listing claims natural light while the structured natural_light field is false.</text><rect x="640" y="100" width="530" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="h" x="662" y="134">Spot 16 · readiness</text><text class="bad" x="662" y="162">MEDIUM candidate contradiction</text><text class="a" x="662" y="196">Copy:</text><text class="a" x="662" y="218">Recién remodelado con acabados modernos.</text><text class="a" x="662" y="254">Structured:</text><text class="a" x="662" y="276">building_status = needs_renovation</text><text class="a" x="662" y="310">Why:</text><text class="a" x="662" y="332">Listing claims ready/remodeled/modern condition while building_status is needs_renovation.</text><rect x="60" y="410" width="530" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="h" x="82" y="444">Spot 21 · security</text><text class="bad" x="82" y="472">HIGH candidate contradiction</text><text class="a" x="82" y="506">Copy:</text><text class="a" x="82" y="528">Seguridad 24/7 y control de acceso.</text><text class="a" x="82" y="564">Structured:</text><text class="a" x="82" y="586">security_type = none</text><text class="a" x="82" y="620">Why:</text><text class="a" x="82" y="642">Listing claims security/access control while security_type is none or missing.</text><rect x="640" y="410" width="530" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="h" x="662" y="444">Spot 272 · parking</text><text class="bad" x="662" y="472">MEDIUM candidate contradiction</text><text class="a" x="662" y="506">Copy:</text><text class="a" x="662" y="528">Cuenta con todos los servicios y estacionamiento.</text><text class="a" x="662" y="564">Structured:</text><text class="a" x="662" y="586">parking_spaces = 0</text><text class="a" x="662" y="620">Why:</text><text class="a" x="662" y="642">Listing explicitly claims parking while parking_spaces is zero/missing and parking is not listed as an am</text></svg>