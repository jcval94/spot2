name: user requested temporal drift audit

on:
  push:
    branches:
      - analysis/user-requested-separate-features-clusters
    paths:
      - ".github/workflows/user-requested-temporal-drift.yml"
      - "scratch/user_requested_temporal_drift_audit.py"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal environment
        run: python -m pip install pandas==2.3.3 numpy==2.3.5 pyarrow==21.0.0
      - name: Audit temporal drift
        run: python scratch/user_requested_temporal_drift_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: user-requested-temporal-drift
          path: scratch/user_requested_temporal_drift_audit.json
          retention-days: 2
