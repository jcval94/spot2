name: Refresh executive One Pager

on:
  push:
    branches: [main]
    paths:
      - "entregable/02_one_pager/ONE_PAGER_SPOT2_AESTHETIC.html"
      - "entregable/01_eda/**"
      - ".github/workflows/refresh-executive-one-pager.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          pip install playwright pypdf nbconvert nbformat
          python -m playwright install --with-deps chromium

      - name: Render One Pager PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from pypdf import PdfReader

          src = Path("entregable/02_one_pager/ONE_PAGER_SPOT2_AESTHETIC.html")
          out = Path("entregable/02_one_pager/ONE_PAGER_SPOT2.pdf")
          html = src.read_text(encoding="utf-8")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 816, "height": 1056})
              page.set_content(html, wait_until="load")
              page.emulate_media(media="print")
              page.pdf(
                  path=str(out),
                  format="Letter",
                  print_background=True,
                  display_header_footer=False,
                  prefer_css_page_size=True,
                  margin={"top":"0","right":"0","bottom":"0","left":"0"},
              )
              browser.close()

          reader = PdfReader(str(out))
          if len(reader.pages) != 1:
              raise SystemExit(f"One Pager must have exactly 1 page; got {len(reader.pages)}")
          if out.stat().st_size < 50_000:
              raise SystemExit("Rendered PDF is unexpectedly small")
          print(f"Rendered {out} ({out.stat().st_size} bytes, 1 page)")
          PY

      - name: Rebuild and validate final delivery ZIP
        run: python entregable/build_final_package.py

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entregable/02_one_pager/ONE_PAGER_SPOT2.pdf entregable/SPOT2_ASSESSMENT_FINAL.zip
          if git diff --cached --quiet; then
            echo "No binary artifacts changed."
          else
            git commit -m "Regenera One Pager y paquete final"
            git push
          fi
