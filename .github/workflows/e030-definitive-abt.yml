name: E030 definitive ABT

on:
  workflow_dispatch:
  push:
    branches:
      - experimentos/drift-feature-validation
    paths:
      - "experimentos/feature_validation/E030_definitive_abt/**"
      - "experimentos/feature_validation/E028_definitive_opportunity_score_abt/target_contract.py"
      - "experimentos/feature_validation/E028_definitive_opportunity_score_abt/target_contract.json"
      - "experimentos/feature_validation/E029_drift_sanitized_release_candidate/results/feature_policy.json"
      - "experimentos/modelo_3/data_pipeline.py"
      - "data/candidate/csv/**"
      - ".github/workflows/e030-definitive-abt.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experimentos/feature_validation/E030_definitive_abt/**"
      - "experimentos/Evidencias/EV-030_definitive_abt.md"
      - ".github/workflows/e030-definitive-abt.yml"

permissions:
  contents: write

concurrency:
  group: e030-definitive-abt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experimentos/feature_validation/E030_definitive_abt/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r experimentos/feature_validation/E030_definitive_abt/requirements.txt

      - name: Compile
        run: |
          python -m py_compile experimentos/feature_validation/E030_definitive_abt/build_abt.py
          python -m py_compile experimentos/feature_validation/E030_definitive_abt/validate_abt.py

      - name: Build definitive ABT
        run: python experimentos/feature_validation/E030_definitive_abt/build_abt.py

      - name: Validate definitive ABT
        run: python experimentos/feature_validation/E030_definitive_abt/validate_abt.py

      - name: Validate outputs
        run: |
          set -euo pipefail
          base="experimentos/feature_validation/E030_definitive_abt/results"
          test -s "$base/abt_all_snapshots.csv.gz"
          test -s "$base/abt_model_ready.csv.gz"
          test -s "$base/abt_schema.json"
          test -s "$base/abt_summary.json"
          test -s "$base/column_roles.csv"
          test -s "$base/stage_target_summary.csv"
          test -s "$base/split_summary.csv"
          test -s "$base/status_summary.csv"
          test -s "$base/validation.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("experimentos/feature_validation/E030_definitive_abt/results/validation.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          if x.get("status") != "PASS":
              raise SystemExit(f"E030 validation failed: {x}")
          print("E030 definitive ABT PASS")
          PY

      - name: Publish summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          b = Path("experimentos/feature_validation/E030_definitive_abt/results")
          s = json.loads((b/"abt_summary.json").read_text())
          v = json.loads((b/"validation.json").read_text())
          print("# E030 definitive ABT")
          print()
          print(f"- Validation: **{v['status']}**")
          print(f"- Audit rows: **{s['audit_rows']:,}**")
          print(f"- Model-ready rows: **{s['model_ready_rows']:,}**")
          print(f"- Model-ready leads: **{s['model_ready_unique_leads']:,}**")
          print(f"- Model features: **{s['model_feature_count']}**")
          print(f"- Ambiguous rows preserved: **{s['ambiguous_rows']:,}**")
          print(f"- Right-censored rows preserved: **{s['right_censored_rows']:,}**")
          PY

      - name: Commit reproducible ABT evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/experimentos/drift-feature-validation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimentos/feature_validation/E030_definitive_abt/results/
          if git diff --cached --quiet; then
            echo "No ABT output changes."
          else
            git commit -m "Add E030 definitive ABT results [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Upload ABT artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e030-definitive-abt
          path: experimentos/feature_validation/E030_definitive_abt/results/
          if-no-files-found: warn
          retention-days: 30
