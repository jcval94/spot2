name: E035 advanced feature engineering

on:
  workflow_dispatch:
  push:
    branches:
      - experimentos/drift-feature-validation
    paths:
      - "experimentos/feature_validation/advanced_fe_common.py"
      - "experimentos/feature_validation/run_e035_advanced_fe.py"
      - "experimentos/feature_validation/E035_outcome_free_advanced_fe/**"
      - ".github/workflows/e035-advanced-fe.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experimentos/feature_validation/advanced_fe_common.py"
      - "experimentos/feature_validation/run_e035_advanced_fe.py"
      - "experimentos/feature_validation/E035_outcome_free_advanced_fe/**"
      - "experimentos/Evidencias/EV-035_advanced_feature_engineering.md"
      - ".github/workflows/e035-advanced-fe.yml"

permissions:
  contents: write

concurrency:
  group: e035-advanced-fe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rolling-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experimentos/feature_validation/semantic_recovery_requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r experimentos/feature_validation/semantic_recovery_requirements.txt
      - name: Compile
        run: |
          python -m py_compile experimentos/feature_validation/advanced_fe_common.py
          python -m py_compile experimentos/feature_validation/run_e035_advanced_fe.py
      - name: Verify E030 source ABT
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("experimentos/feature_validation/E030_definitive_abt/results/validation.json").read_text())
          assert x["status"]=="PASS",x
          PY
      - name: Run E035 rolling development
        run: python experimentos/feature_validation/run_e035_advanced_fe.py
      - name: Validate outputs
        run: |
          test -s experimentos/feature_validation/E035_outcome_free_advanced_fe/results/rolling_fold_metrics.csv
          test -s experimentos/feature_validation/E035_outcome_free_advanced_fe/results/variant_summary.csv
          test -s experimentos/feature_validation/E035_outcome_free_advanced_fe/results/selected_development_challengers.json
          test -s experimentos/feature_validation/E035_outcome_free_advanced_fe/results/REPORT.md
      - name: Publish summary
        run: cat experimentos/feature_validation/E035_outcome_free_advanced_fe/results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit reproducible results
        if: github.event_name == 'push' && github.ref == 'refs/heads/experimentos/drift-feature-validation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimentos/feature_validation/E035_outcome_free_advanced_fe/results/
          if git diff --cached --quiet; then
            echo "No E035 result changes."
          else
            git commit -m "Add E035 advanced FE rolling results [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e035-advanced-fe
          path: experimentos/feature_validation/E035_outcome_free_advanced_fe/results/
          if-no-files-found: warn
          retention-days: 30
