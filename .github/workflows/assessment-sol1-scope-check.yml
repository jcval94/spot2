name: AssessmentSol1 scope check

on:
  push:
    branches:
      - "assessment/assessment-sol1-clean-room"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify write scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          echo "=== literal command requested ==="
          git diff --name-only

          echo "=== committed branch delta vs main ==="
          git diff --name-only origin/main...HEAD | tee /tmp/assessment_changed.txt

          awk '
            $0 !~ /^AssessmentSol1\// &&
            $0 != ".github/workflows/assessment-sol1-scope-check.yml" {
              print "OUT_OF_SCOPE: " $0
              bad=1
            }
            END { exit bad ? 1 : 0 }
          ' /tmp/assessment_changed.txt

      - name: Run contract tests
        shell: bash
        run: |
          python -m pip install -e "AssessmentSol1[dev]"
          pytest -q AssessmentSol1/tests
