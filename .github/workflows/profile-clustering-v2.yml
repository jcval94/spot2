name: Profile clustering benchmark v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "experimentos/profile_clustering_v2/**"
      - "data/candidate/**"
      - "harness/**"
      - ".github/workflows/profile-clustering-v2.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experimentos/profile_clustering_v2/**"
      - "data/candidate/**"
      - "harness/**"
      - ".github/workflows/profile-clustering-v2.yml"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Materialize experiment source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          root = Path("experimentos/profile_clustering_v2")
          packed = (root / ".run_experiments.py.zlib.b64").read_text().strip()
          (root / "run_experiments.py").write_bytes(zlib.decompress(base64.b64decode(packed)))
          PY
          python -m py_compile experimentos/profile_clustering_v2/run_experiments.py

      - name: Validate experiment contracts
        run: |
          python harness/experiment_harness.py validate --spec experimentos/profile_clustering_v2/specs/E001_balanced_profiles.json --repo-root .
          python harness/experiment_harness.py validate --spec experimentos/profile_clustering_v2/specs/E002_lead_facets.json --parent-spec experimentos/profile_clustering_v2/specs/E001_balanced_profiles.json --repo-root .
          python harness/experiment_harness.py validate --spec experimentos/profile_clustering_v2/specs/E003_inquiry_intent.json --parent-spec experimentos/profile_clustering_v2/specs/E002_lead_facets.json --repo-root .

      - name: Run clustering benchmark
        run: python experimentos/profile_clustering_v2/run_experiments.py

      - name: Finalize harness records
        run: |
          mkdir -p "$RUNNER_TEMP/spot2_harness"
          python harness/experiment_harness.py finalize --spec experimentos/profile_clustering_v2/specs/E001_balanced_profiles.json --results experimentos/profile_clustering_v2/results/E001_balanced_profiles_results.json --output-dir "$RUNNER_TEMP/spot2_harness" --repo-root .
          python harness/experiment_harness.py finalize --spec experimentos/profile_clustering_v2/specs/E002_lead_facets.json --results experimentos/profile_clustering_v2/results/E002_lead_facets_results.json --parent-spec experimentos/profile_clustering_v2/specs/E001_balanced_profiles.json --parent-results experimentos/profile_clustering_v2/results/E001_balanced_profiles_results.json --output-dir "$RUNNER_TEMP/spot2_harness" --repo-root .
          python harness/experiment_harness.py finalize --spec experimentos/profile_clustering_v2/specs/E003_inquiry_intent.json --results experimentos/profile_clustering_v2/results/E003_inquiry_intent_results.json --parent-spec experimentos/profile_clustering_v2/specs/E002_lead_facets.json --parent-results experimentos/profile_clustering_v2/results/E002_lead_facets_results.json --output-dir "$RUNNER_TEMP/spot2_harness" --repo-root .

      - name: Validate outputs
        run: |
          test -s experimentos/profile_clustering_v2/README.md
          test -s experimentos/profile_clustering_v2/results/clustering_benchmark.csv
          test -s experimentos/profile_clustering_v2/results/selected_clusterers.csv
          test -s experimentos/profile_clustering_v2/results/profile_interpretability.csv
          test -s experimentos/profile_clustering_v2/results/model_metrics.csv
          test -s experimentos/profile_clustering_v2/results/E003_inquiry_intent_results.json

      - name: Publish README in job summary
        if: always()
        run: |
          if [ -f experimentos/profile_clustering_v2/README.md ]; then
            cat experimentos/profile_clustering_v2/README.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit reproducible results
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimentos/profile_clustering_v2/run_experiments.py experimentos/profile_clustering_v2/README.md experimentos/profile_clustering_v2/results/
          git rm -f experimentos/profile_clustering_v2/.run_experiments.py.zlib.b64
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add profile clustering v2 results [skip ci]"
            git push
          fi

      - name: Upload experiment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-clustering-v2
          path: |
            experimentos/profile_clustering_v2/README.md
            experimentos/profile_clustering_v2/run_experiments.py
            experimentos/profile_clustering_v2/results/
            ${{ runner.temp }}/spot2_harness/
          if-no-files-found: warn
          retention-days: 30
