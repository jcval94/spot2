name: Lead attention experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/lead-attention-two-stage
    paths:
      - "experiments/**"
      - "data/candidate/**"
      - ".github/workflows/lead-attention-experiment.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experiments/**"
      - "data/candidate/**"
      - ".github/workflows/lead-attention-experiment.yml"

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn matplotlib

      - name: Run lead attention experiment
        run: python experiments/lead_attention_experiment.py

      - name: Publish report in job summary
        if: always()
        run: |
          if [ -f artifacts/lead_attention/report.md ]; then
            cat artifacts/lead_attention/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-attention-experiment
          path: artifacts/lead_attention/
          if-no-files-found: warn
          retention-days: 30
