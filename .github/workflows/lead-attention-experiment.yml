name: Spot2 experiments

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiment/response-time-random-forest
    paths:
      - "experimentos/lead_attention/**"
      - "experimentos/response_time_random_forest/**"
      - "data/candidate/**"
      - ".github/workflows/lead-attention-experiment.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experimentos/lead_attention/**"
      - "experimentos/response_time_random_forest/**"
      - "data/candidate/**"
      - ".github/workflows/lead-attention-experiment.yml"

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r experimentos/lead_attention/requirements.txt
          pip install -r experimentos/response_time_random_forest/requirements.txt

      - name: Run lead attention experiment
        run: python experimentos/lead_attention/run_experiment.py

      - name: Run response-time Random Forest experiment
        run: python experimentos/response_time_random_forest/run_experiment.py

      - name: Publish experiment reports in job summary
        if: always()
        run: |
          if [ -f experimentos/lead_attention/results/report.md ]; then
            cat experimentos/lead_attention/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f experimentos/response_time_random_forest/results/report.md ]; then
            printf "\n\n---\n\n" >> "$GITHUB_STEP_SUMMARY"
            cat experimentos/response_time_random_forest/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate evidence links
        run: |
          test -s experimentos/lead_attention/EVIDENCIA.md
          test -s experimentos/response_time_random_forest/EVIDENCIA.md

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot2-experiments
          path: |
            experimentos/lead_attention/EVIDENCIA.md
            experimentos/lead_attention/results/
            experimentos/response_time_random_forest/EVIDENCIA.md
            experimentos/response_time_random_forest/results/
          if-no-files-found: warn
          retention-days: 30
