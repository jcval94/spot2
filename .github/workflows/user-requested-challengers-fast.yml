name: user requested challenger metrics

on:
  push:
    branches:
      - analysis/user-requested-separate-features-clusters
    paths:
      - ".github/workflows/user-requested-challengers-fast.yml"
      - "codexway/tests/test_user_requested_challengers.py"

permissions:
  contents: read

jobs:
  challengers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install minimal locked-compatible environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            pandas==2.3.3 \
            pyarrow==21.0.0 \
            PyYAML==6.0.3 \
            scikit-learn==1.7.2 \
            scipy==1.16.3 \
            statsmodels==0.14.5 \
            pytest==8.4.2 \
            joblib==1.5.2
          python -m pip install -e codexway --no-deps
      - name: Run requested challengers only
        run: python -m pytest codexway/tests/test_user_requested_challengers.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-requested-challenger-metrics
          path: codexway/outputs/metrics/user_requested_challengers.json
          if-no-files-found: warn
          retention-days: 2
