name: LLM inventory semantic audit

concurrency:
  group: e015-live-gpt5nano
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/**"
      - "data/candidate/csv/spots.csv"
      - "data/candidate/csv/spot_attributes.csv"
      - ".github/workflows/llm-inventory-semantic-audit.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "offline or live"
        required: true
        default: "offline"
        type: choice
        options:
          - offline
          - live
      model:
        description: "OpenAI model for live mode"
        required: true
        default: "gpt-5-nano"
        type: string
      limit:
        description: "Maximum listings for live smoke/evaluation"
        required: true
        default: "200"
        type: string

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/tests
      - name: Rebuild offline evidence
        run: python experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/run_offline.py
      - name: Evaluation readiness
        run: python experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/src/evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: e015-offline-evidence
          path: |
            experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/
            experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAIKEY: ${{ secrets.OPENAIKEY }}
      OPENAIAPI: ${{ secrets.OPENAIAPI }}
      OPENAI_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/requirements.txt
      - name: Require API secret
        shell: bash
        run: |
          if [ -z "$OPENAIKEY" ] && [ -z "$OPENAIAPI" ]; then
            echo "Neither OPENAIKEY nor OPENAIAPI secret is configured."
            exit 1
          fi
      - name: Smoke test 10 listings
        run: |
          python experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/run_live.py \
            --model "$OPENAI_MODEL" \
            --limit 10 \
            --budget-usd 1.70 \
            --budget-state experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/live_budget.json \
            --max-error-rate 0.20 \
            --output experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_smoke.jsonl

      - name: Run clean holdout
        run: |
          python experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/run_live.py \
            --model "$OPENAI_MODEL" \
            --input experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/labeling_holdout_v2.csv \
            --output experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_holdout_v2.jsonl \
            --budget-usd 1.70 \
            --budget-state experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/live_budget.json \
            --max-error-rate 0.10

      - name: Run Land semantic challenge
        run: |
          python experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/run_live.py \
            --model "$OPENAI_MODEL" \
            --input experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/semantic_challenge_v2.csv \
            --output experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_semantic_challenge_v2.jsonl \
            --budget-usd 1.70 \
            --budget-state experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/live_budget.json \
            --max-error-rate 0.10

      - name: Summarize holdout cost and overlap
        if: always()
        run: |
          if [ -f experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_holdout_v2.jsonl ]; then
            python experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/src/summarize_live.py \
              --labels experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/labeling_holdout_v2.csv \
              --predictions experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_holdout_v2.jsonl \
              --model "$OPENAI_MODEL" \
              --output experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_holdout_v2_summary.json
          fi

      - name: Summarize semantic challenge
        if: always()
        run: |
          if [ -f experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_semantic_challenge_v2.jsonl ]; then
            python experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/src/summarize_live.py \
              --labels experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/semantic_challenge_v2.csv \
              --predictions experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_semantic_challenge_v2.jsonl \
              --model "$OPENAI_MODEL" \
              --output experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_semantic_challenge_v2_summary.json
          fi

      - name: Evaluation readiness
        if: always()
        run: |
          if [ -f experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_holdout_v2.jsonl ]; then
            python experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/src/evaluate.py \
              --labels experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/labeling_holdout_v2.csv \
              --llm experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/llm_holdout_v2.jsonl \
              --output experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/evaluation_live.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e015-live-gpt-5-nano
          path: |
            experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/results/
            experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/
