name: user requested no-days standardized challengers

on:
  push:
    branches:
      - analysis/user-requested-separate-features-clusters
    paths:
      - ".github/workflows/user-requested-no-days-standardized.yml"
      - "codexway/analysis/user_requested_no_days_standardized.py"

permissions:
  contents: read

jobs:
  challengers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal environment
        run: python -m pip install pandas==2.3.3 numpy==2.3.5 pyarrow==21.0.0 scipy scikit-learn pyyaml
      - name: Run challengers
        env:
          PYTHONPATH: codexway/src
        run: python codexway/analysis/user_requested_no_days_standardized.py
      - uses: actions/upload-artifact@v4
        with:
          name: user-requested-no-days-standardized
          path: codexway/outputs/metrics/user_requested_no_days_standardized.json
          retention-days: 2
