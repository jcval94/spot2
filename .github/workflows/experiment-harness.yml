name: Experiment governance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-experiment-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run harness and sandbox tests
        run: python -m unittest discover -s experimentos/_sistema/tests -p "test_*.py" -v

      - name: Validate example experiment contract
        run: |
          python experimentos/_sistema/harness/experiment_harness.py validate \
            --spec experimentos/_sistema/harness/example_spec.json \
            --repo-root .
