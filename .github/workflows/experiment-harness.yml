name: Experiment harness CI

on:
  push:
    branches:
      - main
      - feature/spot2-experiment-harness
    paths:
      - ".agents/skills/**"
      - "harness/**"
      - "tests/test_experiment_harness.py"
      - ".github/workflows/experiment-harness.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".agents/skills/**"
      - "harness/**"
      - "tests/test_experiment_harness.py"
      - ".github/workflows/experiment-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run harness unit tests
        run: python -m unittest discover -s tests -p "test_experiment_harness.py" -v

      - name: Validate example experiment contract
        run: |
          python harness/experiment_harness.py validate             --spec harness/example_spec.json             --repo-root .
