name: Modelo 3 rolling CV and trajectory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "experimentos/modelo_3/architecture_cv/**"
      - "experimentos/modelo_3/trajectory_cv/**"
      - "experimentos/modelo_3/benchmark_specialists/**"
      - "experimentos/modelo_3/*.py"
      - "data/candidate/**"
      - "experimentos/_sistema/harness/**"
      - ".github/workflows/modelo3-rolling-cv-trajectory.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experimentos/modelo_3/architecture_cv/**"
      - "experimentos/modelo_3/trajectory_cv/**"
      - "experimentos/modelo_3/benchmark_specialists/**"
      - "experimentos/modelo_3/*.py"
      - "data/candidate/**"
      - "experimentos/_sistema/harness/**"
      - ".github/workflows/modelo3-rolling-cv-trajectory.yml"

permissions:
  contents: write

jobs:
  rolling-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experimentos/modelo_3/trajectory_cv/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r experimentos/modelo_3/trajectory_cv/requirements.txt

      - name: Validate E006 contract
        run: |
          python experimentos/_sistema/harness/experiment_harness.py validate \
            --spec experimentos/modelo_3/architecture_cv/experiment_spec.json \
            --parent-spec experimentos/modelo_3/benchmark_specialists/experiment_spec.json \
            --repo-root .

      - name: Run E006 architecture rolling CV
        run: python experimentos/modelo_3/architecture_cv/run_experiment.py

      - name: Finalize E006 record
        run: |
          python experimentos/_sistema/harness/experiment_harness.py finalize \
            --spec experimentos/modelo_3/architecture_cv/experiment_spec.json \
            --results experimentos/modelo_3/architecture_cv/results/harness_results.json \
            --parent-spec experimentos/modelo_3/benchmark_specialists/experiment_spec.json \
            --parent-results experimentos/modelo_3/benchmark_specialists/results/harness_results.json \
            --repo-root . \
            --output-dir experimentos/Evidencias/harness_records

      - name: Validate E006 outputs
        run: |
          test -s experimentos/modelo_3/architecture_cv/results/REPORT.md
          test -s experimentos/modelo_3/architecture_cv/results/oof_predictions.csv
          test -s experimentos/modelo_3/architecture_cv/results/oof_metrics.csv
          test -s experimentos/modelo_3/architecture_cv/results/fold_metrics.csv
          test -s experimentos/modelo_3/architecture_cv/results/fold_metric_summary.csv
          test -s experimentos/modelo_3/architecture_cv/results/bootstrap_deltas_vs_multihead.csv
          test -s experimentos/modelo_3/architecture_cv/results/summary.json
          test -s experimentos/Evidencias/harness_records/E006_architecture_rolling_cv/record.json

      - name: Validate E007 contract
        run: |
          python experimentos/_sistema/harness/experiment_harness.py validate \
            --spec experimentos/modelo_3/trajectory_cv/experiment_spec.json \
            --parent-spec experimentos/modelo_3/architecture_cv/experiment_spec.json \
            --repo-root .

      - name: Run E007 trajectory rolling CV
        run: python experimentos/modelo_3/trajectory_cv/run_experiment.py

      - name: Finalize E007 record
        run: |
          python experimentos/_sistema/harness/experiment_harness.py finalize \
            --spec experimentos/modelo_3/trajectory_cv/experiment_spec.json \
            --results experimentos/modelo_3/trajectory_cv/results/harness_results.json \
            --parent-spec experimentos/modelo_3/architecture_cv/experiment_spec.json \
            --parent-results experimentos/modelo_3/architecture_cv/results/harness_results.json \
            --repo-root . \
            --output-dir experimentos/Evidencias/harness_records

      - name: Validate E007 outputs
        run: |
          test -s experimentos/modelo_3/trajectory_cv/results/REPORT.md
          test -s experimentos/modelo_3/trajectory_cv/results/oof_predictions.csv
          test -s experimentos/modelo_3/trajectory_cv/results/oof_metrics.csv
          test -s experimentos/modelo_3/trajectory_cv/results/fold_metrics.csv
          test -s experimentos/modelo_3/trajectory_cv/results/paired_bootstrap.csv
          test -s experimentos/modelo_3/trajectory_cv/results/summary.json
          test -s experimentos/Evidencias/harness_records/E007_trajectory_progression_cv/record.json

      - name: Publish summaries
        if: always()
        run: |
          if [ -f experimentos/modelo_3/architecture_cv/results/REPORT.md ]; then
            echo "# E006 — Architecture rolling CV" >> "$GITHUB_STEP_SUMMARY"
            cat experimentos/modelo_3/architecture_cv/results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f experimentos/modelo_3/trajectory_cv/results/REPORT.md ]; then
            echo "# E007 — Trajectory rolling CV" >> "$GITHUB_STEP_SUMMARY"
            cat experimentos/modelo_3/trajectory_cv/results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit reproducible results
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimentos/modelo_3/architecture_cv/results/
          git add experimentos/modelo_3/trajectory_cv/results/
          git add experimentos/Evidencias/harness_records/E006_architecture_rolling_cv/
          git add experimentos/Evidencias/harness_records/E007_trajectory_progression_cv/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Add rolling CV and trajectory results [skip ci]"
            git push
          fi

      - name: Upload CV artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelo3-rolling-cv-trajectory
          path: |
            experimentos/modelo_3/architecture_cv/results/
            experimentos/modelo_3/trajectory_cv/results/
            experimentos/Evidencias/harness_records/E006_architecture_rolling_cv/
            experimentos/Evidencias/harness_records/E007_trajectory_progression_cv/
          if-no-files-found: warn
          retention-days: 30
