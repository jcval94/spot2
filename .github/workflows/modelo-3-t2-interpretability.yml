name: Modelo 3 T2 interpretability

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "experimentos/modelo_3/interpretabilidad_t2/**"
      - "experimentos/modelo_3/*.py"
      - "data/candidate/**"
      - "experimentos/_sistema/harness/**"
      - ".github/workflows/modelo-3-t2-interpretability.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experimentos/modelo_3/interpretabilidad_t2/**"
      - "experimentos/modelo_3/*.py"
      - "data/candidate/**"
      - "experimentos/_sistema/harness/**"
      - ".github/workflows/modelo-3-t2-interpretability.yml"

permissions:
  contents: write

jobs:
  interpretability:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experimentos/modelo_3/interpretabilidad_t2/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r experimentos/modelo_3/interpretabilidad_t2/requirements.txt

      - name: Validate analysis contract
        run: |
          python experimentos/_sistema/harness/experiment_harness.py validate \
            --spec experimentos/modelo_3/interpretabilidad_t2/experiment_spec.json \
            --repo-root .

      - name: Run T2 interpretability analysis
        run: python experimentos/modelo_3/interpretabilidad_t2/run_analysis.py

      - name: Validate outputs
        run: |
          test -s experimentos/modelo_3/interpretabilidad_t2/EVIDENCIA.md
          test -s experimentos/modelo_3/interpretabilidad_t2/results/REPORT.md
          test -s experimentos/modelo_3/interpretabilidad_t2/results/model_fidelity.json
          test -s experimentos/modelo_3/interpretabilidad_t2/results/multihead_permutation_importance.csv
          test -s experimentos/modelo_3/interpretabilidad_t2/results/rf_permutation_importance.csv
          test -s experimentos/modelo_3/interpretabilidad_t2/results/rf_impurity_importance.csv
          test -s experimentos/modelo_3/interpretabilidad_t2/results/family_importance.csv
          test -s experimentos/modelo_3/interpretabilidad_t2/results/family_importance_robustness.csv
          test -s experimentos/modelo_3/interpretabilidad_t2/results/directionality.csv
          test -s experimentos/modelo_3/interpretabilidad_t2/results/rank_concordance.json
          test -s experimentos/modelo_3/interpretabilidad_t2/results/charts/multihead_feature_importance.png
          test -s experimentos/modelo_3/interpretabilidad_t2/results/charts/family_importance.png

      - name: Publish summary
        if: always()
        run: |
          if [ -f experimentos/modelo_3/interpretabilidad_t2/results/REPORT.md ]; then
            cat experimentos/modelo_3/interpretabilidad_t2/results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit reproducible results
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimentos/modelo_3/interpretabilidad_t2/results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Add T2 interpretability results [skip ci]"
            git push
          fi

      - name: Upload interpretability artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelo-3-t2-interpretability
          path: |
            experimentos/modelo_3/interpretabilidad_t2/EVIDENCIA.md
            experimentos/modelo_3/interpretabilidad_t2/results/
          if-no-files-found: warn
          retention-days: 30
