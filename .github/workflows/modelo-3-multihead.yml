name: Modelo 3 multi-head experiment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "experimentos/modelo_3/*.py"
      - "experimentos/modelo_3/experiment_spec.json"
      - "experimentos/modelo_3/requirements.txt"
      - "data/candidate/**"
      - "experimentos/_sistema/harness/**"
      - ".github/workflows/modelo-3-multihead.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experimentos/modelo_3/*.py"
      - "experimentos/modelo_3/experiment_spec.json"
      - "experimentos/modelo_3/requirements.txt"
      - "data/candidate/**"
      - "experimentos/_sistema/harness/**"
      - ".github/workflows/modelo-3-multihead.yml"

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experimentos/modelo_3/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r experimentos/modelo_3/requirements.txt

      - name: Validate experiment contract and leakage review
        run: |
          python experimentos/_sistema/harness/experiment_harness.py validate \
            --spec experimentos/modelo_3/experiment_spec.json \
            --repo-root .

      - name: Run multi-head experiment
        run: python experimentos/modelo_3/run_experiment.py

      - name: Finalize traceable harness record
        run: |
          python experimentos/_sistema/harness/experiment_harness.py finalize \
            --spec experimentos/modelo_3/experiment_spec.json \
            --results experimentos/modelo_3/results/harness_results.json \
            --repo-root . \
            --output-dir experimentos/Evidencias/harness_records

      - name: Validate required outputs
        run: |
          test -s experimentos/modelo_3/EVIDENCIA.md
          test -s experimentos/modelo_3/results/summary.md
          test -s experimentos/modelo_3/results/summary.json
          test -s experimentos/modelo_3/results/metrics_by_stage.csv
          test -s experimentos/modelo_3/results/population_by_stage.csv
          test -s experimentos/modelo_3/results/calibration.json
          test -s experimentos/modelo_3/results/harness_results.json
          test -s experimentos/modelo_3/artifacts/multihead_model.pt
          test -s experimentos/modelo_3/artifacts/test_predictions.csv
          test -s experimentos/Evidencias/harness_records/E003_modelo_3_multihead/record.json

      - name: Publish experiment summary
        if: always()
        run: |
          if [ -f experimentos/modelo_3/results/summary.md ]; then
            cat experimentos/modelo_3/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit reproducible text results
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimentos/modelo_3/results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Add Modelo 3 multi-head results [skip ci]"
            git push
          fi

      - name: Upload model and predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelo-3-multihead-artifacts
          path: |
            experimentos/modelo_3/EVIDENCIA.md
            experimentos/modelo_3/results/
            experimentos/modelo_3/artifacts/
            experimentos/Evidencias/harness_records/E003_modelo_3_multihead/
          if-no-files-found: warn
          retention-days: 30
