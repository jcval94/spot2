name: E016 GPT-5 mini semantic challenger

on:
  push:
    branches:
      - "experiment/e016-gpt5mini-semantic-challenger"
  workflow_dispatch:

concurrency:
  group: e016-gpt5mini-semantic-challenger
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAIKEY: ${{ secrets.OPENAIKEY }}
      OPENAIAPI: ${{ secrets.OPENAIAPI }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/tests

      - name: Require API secret
        shell: bash
        run: |
          if [ -z "$OPENAIKEY" ] && [ -z "$OPENAIAPI" ]; then
            echo "Neither OPENAIKEY nor OPENAIAPI secret is configured."
            exit 1
          fi

      - name: Smoke test first 10 holdout rows
        run: |
          python experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/src/run_set.py \
            --input experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/labeling_holdout_v2.csv \
            --output experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/gpt5mini_holdout.jsonl \
            --budget-state experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/budget.json \
            --budget-usd 2.00 \
            --limit 10 \
            --max-error-rate 0.20

      - name: Run full clean holdout
        run: |
          python experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/src/run_set.py \
            --input experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/labeling_holdout_v2.csv \
            --output experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/gpt5mini_holdout.jsonl \
            --budget-state experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/budget.json \
            --budget-usd 2.00 \
            --max-error-rate 0.02

      - name: Run S001 Land challenge
        run: |
          python experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/src/run_set.py \
            --input experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/semantic_challenge_v2.csv \
            --output experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/gpt5mini_challenge.jsonl \
            --budget-state experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/budget.json \
            --budget-usd 2.00 \
            --max-error-rate 0.02

      - name: Summarize holdout
        if: always()
        run: |
          if [ -f experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/gpt5mini_holdout.jsonl ]; then
            python experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/src/summarize.py \
              --labels experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/labeling_holdout_v2.csv \
              --predictions experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/gpt5mini_holdout.jsonl \
              --budget-state experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/budget.json \
              --output experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/holdout_summary.json
          fi

      - name: Summarize challenge
        if: always()
        run: |
          if [ -f experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/gpt5mini_challenge.jsonl ]; then
            python experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/src/summarize.py \
              --labels experimentos/llm_inventory_quality/E015_llm_inventory_semantic_audit/labeling/semantic_challenge_v2.csv \
              --predictions experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/gpt5mini_challenge.jsonl \
              --budget-state experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/budget.json \
              --output experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/challenge_summary.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e016-gpt5mini-semantic-challenger
          path: experimentos/llm_inventory_quality/E016_gpt5mini_semantic_challenger/results/
