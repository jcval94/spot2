<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Del EDA a Feature Engineering: una frontera gobernada"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#5c667a}.axis{font-size:12px;fill:#6d7687}.label{font-size:13px;font-weight:600}.value{font-size:12px;font-weight:700}.big{font-size:30px;font-weight:800}.note{font-size:12px;fill:#5c667a}.grid{stroke:#e6e9ef;stroke-width:1}.a{fill:#2f6b8a}.b{fill:#d98743}.c{fill:#6d9b76}.d{fill:#8b78a8}.soft{fill:#f1f3f6}.card{fill:#fbfcfe;stroke:#e1e6ed;stroke-width:1}</style><rect width="960" height="560" fill="#fff"/><text x="60" y="48" class="title">Del EDA a construcción de variables: una frontera gobernada</text><text x="60" y="75" class="sub">Señales contemporáneas del lead vs. Inventory, clocks o estado mutable.</text><rect x="60" y="115" width="405" height="360" rx="14" class="card"/><rect x="495" y="115" width="405" height="360" rx="14" class="card"/><rect x="60" y="115" width="405" height="10" rx="5" class="c"/><rect x="495" y="115" width="405" height="10" rx="5" class="b"/>
<text x="85" y="160" class="label">Promover / construir en Calidad del lead</text>
<text x="85" y="205" class="axis">• user_type / company_size / industry</text><text x="85" y="247" class="axis">• sector / modalidad / geografía / fuente</text><text x="85" y="289" class="axis">• channel / message_length</text><text x="85" y="331" class="axis">• requested_area / budget aplicable</text><text x="85" y="373" class="axis">• urgency + not_stated / asked_visit</text><text x="85" y="415" class="axis">• ratios y gaps determinísticos T0→T1</text>
<text x="520" y="160" class="label">Fuera del Calidad del lead core</text>
<text x="520" y="205" class="axis">• Disponibilidad / antigüedad del registro</text><text x="520" y="247" class="axis">• profundidad de candidatos / spot físico</text><text x="520" y="289" class="axis">• Contexto de mercado</text><text x="520" y="331" class="axis">• identificadores de segmentos como reglas</text><text x="520" y="373" class="axis">• total bruto de consultas / conteo futuro</text><text x="520" y="415" class="axis">• respuesta del intermediario / estado mutable del inmueble</text>
<text x="60" y="510" class="note">La frontera se decide por reloj y pregunta de negocio, no por correlación aislada.</text></svg>