<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Quality e Inventory son dos ejes operativos distintos"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#5c667a}.axis{font-size:12px;fill:#6d7687}.label{font-size:13px;font-weight:600}.value{font-size:12px;font-weight:700}.big{font-size:30px;font-weight:800}.note{font-size:12px;fill:#5c667a}.grid{stroke:#e6e9ef;stroke-width:1}.a{fill:#2f6b8a}.b{fill:#d98743}.c{fill:#6d9b76}.d{fill:#8b78a8}.soft{fill:#f1f3f6}.card{fill:#fbfcfe;stroke:#e1e6ed;stroke-width:1}</style><rect width="960" height="560" fill="#fff"/><text x="60" y="48" class="title">Calidad e Inventario son dos ejes operativos distintos</text><text x="60" y="75" class="sub">El producto debe conservar ambos componentes visibles para decidir la acción.</text><text x="95" y="315" transform="rotate(-90 95 315)" class="label">Capacidad del inventario →</text><text x="455" y="500" class="label">Calidad del lead →</text>
<rect x="170" y="125" width="285" height="130" rx="14" class="card"/><rect x="170" y="125" width="10" height="130" rx="5" class="a"/><text x="195" y="165" class="label">Calidad baja + Inventario alto</text><text x="195" y="200" class="axis">Oferta disponible no compensa</text><text x="195" y="220" class="axis">baja prioridad comercial.</text>
<rect x="500" y="125" width="285" height="130" rx="14" class="card"/><rect x="500" y="125" width="10" height="130" rx="5" class="c"/><text x="525" y="165" class="label">Calidad alta + Inventario alto</text><text x="525" y="205" class="value">Trabajar ahora</text>
<rect x="170" y="285" width="285" height="130" rx="14" class="card"/><rect x="170" y="285" width="10" height="130" rx="5" class="d"/><text x="195" y="325" class="label">Calidad baja + Inventario bajo</text><text x="195" y="365" class="axis">No priorizar; búsqueda de oferta si aplica.</text>
<rect x="500" y="285" width="285" height="130" rx="14" class="card"/><rect x="500" y="285" width="10" height="130" rx="5" class="b"/><text x="525" y="325" class="label">Calidad alta + Inventario bajo</text><text x="525" y="365" class="value">Priorizar alternativa / alternativa</text>
<line x1="475" y1="110" x2="475" y2="430" class="grid"/><line x1="155" y1="270" x2="800" y2="270" class="grid"/><text x="170" y="455" class="axis">Bajo</text><text x="760" y="455" class="axis">Alto</text><text x="125" y="400" class="axis">Bajo</text><text x="125" y="145" class="axis">Alto</text></svg>