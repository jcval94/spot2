<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Clustering: conservar el conocimiento, no idolatrar el ID"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#5c667a}.axis{font-size:12px;fill:#6d7687}.label{font-size:13px;font-weight:600}.value{font-size:12px;font-weight:700}.big{font-size:30px;font-weight:800}.note{font-size:12px;fill:#5c667a}.grid{stroke:#e6e9ef;stroke-width:1}.a{fill:#2f6b8a}.b{fill:#d98743}.c{fill:#6d9b76}.d{fill:#8b78a8}.soft{fill:#f1f3f6}.card{fill:#fbfcfe;stroke:#e1e6ed;stroke-width:1}</style><rect width="960" height="560" fill="#fff"/><text x="60" y="48" class="title">Clustering: conservar el conocimiento, no idolatrar el ID</text><text x="60" y="75" class="sub">Síntesis de qué conceptos sobrevivieron a la investigación y cuáles no.</text><text x="75" y="120" class="axis">Experimento</text><text x="300" y="120" class="axis">Qué aprendió</text><text x="690" y="120" class="axis">Rol final</text>
