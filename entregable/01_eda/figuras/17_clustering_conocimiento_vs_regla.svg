<rect x="65" y="277" width="830" height="50" rx="9" class="card"/><rect x="65" y="277" width="8" height="50" rx="4" class="a"/><text x="85" y="308" class="label">Broker Service</text><text x="300" y="308" class="axis">faceta de servicio</text><text x="690" y="308" class="value">Auxiliar</text>
