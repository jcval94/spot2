<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="T0 → T1 → T2 cambia el conjunto de información"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#5c667a}.axis{font-size:12px;fill:#6d7687}.label{font-size:13px;font-weight:600}.value{font-size:12px;font-weight:700}.big{font-size:30px;font-weight:800}.note{font-size:12px;fill:#5c667a}.grid{stroke:#e6e9ef;stroke-width:1}.axisline{stroke:#9aa3b2;stroke-width:1}.a{fill:#2f6b8a}.b{fill:#d98743}.c{fill:#6d9b76}.d{fill:#8b78a8}.soft{fill:#f1f3f6}.card{fill:#fbfcfe;stroke:#e1e6ed;stroke-width:1}.lineA{fill:none;stroke:#2f6b8a;stroke-width:4}.ptA{fill:#2f6b8a}</style><rect width="960" height="560" fill="#fff"/><text x="60" y="48" class="title">T0 → T1 → T2 cambia el conjunto de información</text><text x="60" y="75" class="sub">La arquitectura temporal define qué señales son legítimas en cada momento.</text><line x1="145" y1="255" x2="815" y2="255" stroke="#c9d0da" stroke-width="5"/><circle cx="180" cy="255" r="17" class="a"/><circle cx="480" cy="255" r="17" class="b"/><circle cx="780" cy="255" r="17" class="c"/>
<rect x="70" y="120" width="220" height="115" rx="12" class="card"/><rect x="70" y="120" width="220" height="8" rx="4" class="a"/><text x="85" y="153" class="label">T0 · lead.created_at</text><text x="85" y="180" class="axis">• Registro inicial</text><text x="85" y="200" class="axis">• Necesidad inicial</text><text x="85" y="220" class="axis">• Sin primera consulta</text><rect x="70" y="290" width="220" height="82" rx="12" class="card"/><text x="85" y="323" class="value">Sensibilidad</text><text x="85" y="348" class="axis">Exposure fuerte</text>
<rect x="370" y="120" width="220" height="115" rx="12" class="card"/><rect x="370" y="120" width="220" height="8" rx="4" class="b"/><text x="385" y="153" class="label">T1 · primera consulta</text><text x="385" y="180" class="axis">• Solicitud registrada</text><text x="385" y="200" class="axis">• Solicitud + intención</text><text x="385" y="220" class="axis">• Antes de la respuesta del intermediario</text><rect x="370" y="290" width="220" height="82" rx="12" class="card"/><text x="385" y="323" class="value">Contrato principal</text><text x="385" y="348" class="axis">Primer punto accionable</text>
<rect x="670" y="120" width="220" height="115" rx="12" class="card"/><rect x="670" y="120" width="220" height="8" rx="4" class="c"/><text x="685" y="153" class="label">T2 · consulta posterior</text><text x="685" y="180" class="axis">• Registro inicial + payload actual</text><text x="685" y="200" class="axis">• Trayectoria estrictamente previa</text><text x="685" y="220" class="axis">• Sin response history insegura</text><rect x="670" y="290" width="220" height="82" rx="12" class="card"/><text x="685" y="323" class="value">Alternativa evaluada</text><text x="685" y="348" class="axis">Extensión, no reemplazo</text>
<text x="70" y="448" class="label">Regla temporal</text><text x="70" y="478" class="note">Cada evaluación usa únicamente información que ya existía en su momento de evaluación. No se promedian T0, T1 y T2.</text></svg>