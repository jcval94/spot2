<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Pockets prometedores no sobrevivieron como regla confirmada"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#5c667a}.axis{font-size:12px;fill:#6d7687}.label{font-size:13px;font-weight:600}.value{font-size:12px;font-weight:700}.big{font-size:30px;font-weight:800}.note{font-size:12px;fill:#5c667a}.grid{stroke:#e6e9ef;stroke-width:1}.a{fill:#2f6b8a}.b{fill:#d98743}.c{fill:#6d9b76}.d{fill:#8b78a8}.soft{fill:#f1f3f6}.card{fill:#fbfcfe;stroke:#e1e6ed;stroke-width:1}</style><rect width="960" height="560" fill="#fff"/><text x="60" y="48" class="title">Segmentos prometedores no sobrevivieron como regla confirmada</text><text x="60" y="75" class="sub">Señal local histórica frente al rerun final con control de multiplicidad.</text><rect x="65" y="120" width="510" height="320" rx="14" class="card"/><rect x="605" y="120" width="290" height="320" rx="14" class="card"/>
