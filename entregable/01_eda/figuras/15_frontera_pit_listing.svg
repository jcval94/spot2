<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="La frontera PIT no es igual para todo el inventario"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#5c667a}.axis{font-size:12px;fill:#6d7687}.label{font-size:13px;font-weight:600}.value{font-size:12px;font-weight:700}.big{font-size:30px;font-weight:800}.note{font-size:12px;fill:#5c667a}.grid{stroke:#e6e9ef;stroke-width:1}.a{fill:#2f6b8a}.b{fill:#d98743}.c{fill:#6d9b76}.d{fill:#8b78a8}.soft{fill:#f1f3f6}.card{fill:#fbfcfe;stroke:#e1e6ed;stroke-width:1}</style><rect width="960" height="560" fill="#fff"/><text x="60" y="48" class="title">La frontera histórico no es igual para todo el inventario</text><text x="60" y="75" class="sub">Disponibilidad tiene reloj histórico; los campos del listing no están versionados.</text><rect x="70" y="125" width="360" height="295" rx="15" class="card"/><rect x="530" y="125" width="360" height="295" rx="15" class="card"/><rect x="70" y="125" width="360" height="10" rx="5" class="c"/><rect x="530" y="125" width="360" height="10" rx="5" class="b"/>
<text x="95" y="170" class="label">Disponibilidad · versionado</text><text x="95" y="215" class="big">Correcto históricamente</text><text x="95" y="250" class="axis">registro_date ≤ momento de evaluación</text><text x="95" y="285" class="axis">• historial explícito</text><text x="95" y="310" class="axis">• Último registro conocido</text><text x="95" y="335" class="axis">• 0 future-registro violations</text>
<text x="555" y="170" class="label">Atributos del inmueble · estado actual</text><text x="555" y="215" class="big">CONDICIONAL</text><text x="555" y="250" class="axis">Sin fecha efectiva/versión</text><text x="555" y="285" class="axis">• precio</text><text x="555" y="310" class="axis">• área / geografía</text><text x="555" y="335" class="axis">• atributos / updates</text>
<line x1="430" y1="275" x2="530" y2="275" stroke="#c9d0da" stroke-width="3" stroke-dasharray="7 7"/><text x="480" y="260" text-anchor="middle" class="axis">no inferir</text>
<text x="70" y="475" class="note">Que el Spot existiera no prueba que cada atributo actual tuviera el mismo valor histórico.</text></svg>